# เป้าหมายระดับ ecosystem — ใช้ตอบคำถาม "ทำไมต้องทำสิ่งนี้ก่อน"
#
# ⚠️ สามข้อนี้ **ตัดสินโดย Architecture Owner** ไม่ได้ derive มาจากเอกสารไหน
#    เพราะไม่มีเอกสารไหนในทั้ง ecosystem เขียนเป้าหมายไว้เลย (ค้น 3 repo ได้ 0 ผลลัพธ์)
#
# รอบแรกผมใส่ไว้ 5 ข้อโดยเอา "กติกา" มาติดป้ายว่า "เป้าหมาย" — contract เป็นแหล่ง
# ความจริงเดียว · conformance ต้องพิสูจน์ได้ · ทุก component มีเจ้าของ · ห้ามสร้าง
# abstraction ซ้ำ ทั้งสี่ข้อเป็นกฎที่มี ADR หรือ guardian rule บังคับอยู่แล้ว
# การเขียนซ้ำเป็นเป้าหมายทำให้ advisor ตอบวนกลับที่ตัวเอง: "ทำ X เพราะกฎ X"
#
# เป้าหมายตอบว่า "อยากไปถึงอะไร" · กติกาตอบว่า "ห้ามทำอะไร" — คนละชั้น
mission:
  decided_by: architecture-owner
  decided_at: 2026-08-22
  context: ref/chatgpt-ecosystem-overview.md   # ที่มาของโจทย์ ไม่ใช่ที่มาของเป้าหมาย
  goals:
    - id: contract-change-without-surprise
      goal: เปลี่ยน contract ได้โดยไม่มีทีมไหนพังแบบไม่รู้ตัว
      decided_by: architecture-owner
      decided_at: 2026-08-22

    - id: team-sees-its-place
      goal: ทีมตอบได้เสมอว่างานของตัวเองต่อกับภาพใหญ่ตรงไหน โดยไม่ต้องถามคน
      decided_by: architecture-owner
      decided_at: 2026-08-22

    - id: declared-equals-real
      goal: ของที่ประกาศว่ามี ต้องพิสูจน์ได้ว่ามีจริง — ทั้ง repo, contract และ conformance
      decided_by: architecture-owner
      decided_at: 2026-08-22

# กฎที่ทุก plane ต้องเคารพ — input โดยตรงของ M5 Architecture Guardian
# ที่มา: agent-platform/planes/README.md (devfactory-core RFC-0004 · ADR-0003 · ADR-0005)
architecture_rules:
  - id: execution-no-governance
    rule: execution ไม่ตัดสิน governance เอง
  - id: execution-no-backend
    rule: execution ไม่แตะ backend resource ตรง ๆ
  - id: execution-no-credential
    rule: execution ไม่ถือ provider credential เอง
  - id: orchestration-no-artifact
    rule: orchestration ไม่แก้ artifact เอง
  - id: no-vendor-privilege
    rule: external agent provider อยู่ใต้กฎเดียวกัน ไม่มีสิทธิ์พิเศษเพราะเป็นของ vendor

# ─────────────────────────────────────────────────────────────────────────
# CONTRACTS — อ้างอิงเท่านั้น schema จริงอยู่ที่ agent-platform
# ─────────────────────────────────────────────────────────────────────────
contracts:
  - { id: identity/v1,   authority: agent-platform, status: v1 }
  - { id: agent/v1,      authority: agent-platform, status: v1 }
  - { id: capability/v1, authority: agent-platform, status: v1 }
  - { id: provider/v1,   authority: agent-platform, status: v1 }
  - { id: model/v1,      authority: agent-platform, status: v1 }
  - { id: tool/v1,       authority: agent-platform, status: v1 }
  - { id: mcp/v1,        authority: agent-platform, status: v1 }
  - { id: execution/v1,  authority: agent-platform, status: v1 }
  - { id: policy/v1,     authority: agent-platform, status: v1 }
  - { id: artifact/v1,   authority: agent-platform, status: v1 }
  - { id: error/v1,      authority: agent-platform, status: v1 }
  - { id: profile/v1,    authority: agent-platform, status: v1 }
  - { id: consent/v1,    authority: agent-platform, status: v1 }
  - id: approval/v1
    authority: agent-platform
    semantics_owner: devfactory-core
    derived: true
    status: v1
  - id: event/v1
    authority: agent-platform
    semantics_owner: devfactory-core
    derived: true
    status: v1

# ─────────────────────────────────────────────────────────────────────────
# PLANES — 11 ตัว นิยามโดย agent-platform/planes/
# ─────────────────────────────────────────────────────────────────────────
planes:
  - id: gateway
    name: Gateway Plane
    responsibility: ทางเข้า inbound — auth, policy check, audit
    contracts: []
    must_not:
      - เป็น model-gateway (outbound) — คนละตัวกัน
      - เป็น agent-fleet (fan-out) — คนละตัวกัน

  - id: runtime
    name: Runtime Plane
    responsibility: agent loop, state, lifecycle — native + external
    contracts: [execution/v1]
    must_not:
      - ทำหน้าที่ sandbox — runtime ตัดสินว่าจะรันอะไร sandbox คือที่ที่มันรัน

  - id: harness
    name: Harness Plane
    responsibility: execution policy — บังคับลำดับขั้นในหนึ่งงาน
    contracts: [profile/v1]
    must_not:
      - เป็น evals — harness รันใน production, evals เป็น test rig ตอน CI
      - เป็น workflow — harness อยู่ใน lifetime ของ request เดียว, workflow durable ข้าม process

  - id: evals
    name: Evals Plane
    responsibility: สนามทดสอบ — scenario, evaluator, regression
    contracts: []
    must_not:
      - บังคับ policy ใน production — นั่นคือ harness

  - id: tools
    name: Tools Plane
    responsibility: catalog ของ tool + MCP registration
    contracts: [tool/v1, mcp/v1]
    must_not:
      - ตัดสินว่าใครใช้ tool ได้ — นั่นคือ policy

  - id: policy
    name: Policy Plane
    responsibility: ทำได้ไหม ต้องให้ใครอนุมัติ
    contracts: [policy/v1, approval/v1]
    must_not:
      - ปนผลประเมินของเครื่อง (policy) กับคำตัดสินของผู้มีอำนาจ (approval)

  - id: knowledge
    name: Knowledge Plane
    responsibility: ingest, retrieval, citation, ACL
    contracts: [tool/v1]
    must_not:
      - generate คำตอบเอง — retrieval ไม่ generate

  - id: workflow
    name: Workflow Plane
    responsibility: orchestration ข้ามขั้น ข้าม agent
    contracts: [execution/v1]
    must_not:
      - แก้ artifact เอง

  - id: sandbox
    name: Sandbox Plane
    responsibility: ที่ที่ command รันจริง + isolation
    contracts: [capability/v1]
    must_not: []

  - id: observability
    name: Observability Plane
    responsibility: trace, audit, cost, replay
    contracts: [event/v1]
    must_not: []

  - id: backend-os
    name: Backend OS Plane
    responsibility: data plane + connector + บ้านของ native runtime
    contracts: [identity/v1]
    must_not: []

