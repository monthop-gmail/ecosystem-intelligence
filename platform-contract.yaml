# Consumer manifest — ประกาศว่า repo นี้ยึด contract อะไรของ agent-platform
#
# รูปแบบตาม ADR-0006:
#   https://github.com/monthop-gmail/agent-platform/blob/main/decisions/0006-contract-versioning.md
#
# repo นี้เป็น **ผู้ผลิต event** ไม่ใช่ผู้บริโภค — ปล่อย ADVISORY_ISSUED และ
# ECOSYSTEM_DRIFT_DETECTED ออกมาให้ระบบอื่นรับไปทำต่อ แต่ยังต้อง conform เท่ากัน
# เพราะฝั่งที่ผลิต payload ผิดคือฝั่งที่ทำให้ audit log ของคนอื่นพัง

platform_contract_version: "0.1"

contracts:
  - event/v1       # ปล่อย ADVISORY_ISSUED · ECOSYSTEM_DRIFT_DETECTED
  - identity/v1    # tenant_id และรูปแบบ Id ของทุก event ที่ปล่อย

conformance:
  status: passing
  last_verified: 2026-09-20

  # ADR-0006 บังคับ consumer 3 ข้อ
  #   1. manifest         ไฟล์นี้
  #   2. conformance test conformance/payload_check.py — ผลิต payload จากการรัน
  #                       advisor และ guardian กับ ecosystem จริง แล้ว validate
  #                       กับ schema ที่ pin ไว้ · ไม่มี fixture ที่เขียนขึ้นเพื่อให้ผ่าน
  #                       ตรวจ guarantee ที่ JSON Schema ตรวจไม่ได้อีก 10 ข้อ
  #   3. release gate     job `conformance` ใน .github/workflows/validate.yml รันทุก PR
  #
  # ⚠️ ข้อ 3 จะบล็อกการ merge ได้จริงต่อเมื่อเปิด branch protection แล้วตั้ง check
  #    เป็น required — เป็น repo setting ไม่ใช่สิ่งที่ไฟล์นี้ยืนยันได้

pinned_contracts_commit: d333cac58ac9e97db9328084c9d3eb89ec9e0d1d   # conformance/pinned.yaml
semantics_version: "1.5"   # event/v1 v1.8.0 · derived_from ของ schema ที่ pin ไว้

# vocabulary ที่ repo นี้เพิ่มเข้ามาเอง
#
# `event/v1` $defs.EventTypeName บังคับแค่ **รูปแบบชื่อ** (^[A-Z][A-Z0-9_]{2,63}$)
# ไม่ได้บังคับตัวค่า — ADR-0006 Rule 2 ตั้งใจให้ vocabulary โตได้โดยไม่ต้องมี RFC
# ที่ต้นทาง เราจึงประกาศสองค่านี้ได้เอง และบันทึกไว้ที่นี่ให้ platform เห็น
#
# ยืนยันด้วยการ validate กับ schema ที่ pin ไว้จริง ไม่ได้อนุมานจากคำอธิบาย
vocabulary_added:
  - name: ADVISORY_ISSUED
    subject_type: record
    record_type: ecosystem_advisory
    meaning: ระบบเสนอสิ่งที่ทีมหนึ่งควรทำต่อ พร้อมเหตุผลและสิ่งที่ใช้อ้างอิง
  - name: ECOSYSTEM_DRIFT_DETECTED
    subject_type: record
    record_type: ecosystem_drift
    meaning: กฎ architecture หรือ contract ข้อหนึ่งถูกละเมิด พร้อมทางแก้

# ── event_id ผูกกับอะไร — คำสัญญา ไม่ใช่พฤติกรรมวันนี้ (devfactory-core#32)
#
# record เดิมได้ `event_id` เดิมเสมอ ข้ามรุ่น ข้ามการรื้อ emitter · สิ่งที่ประกอบเป็น
# "record เดิม" คือรายการข้างล่างนี้เท่านั้น และ **รายการนี้ frozen** — แก้เมื่อไร
# เป็น breaking ต้องแจ้ง consumer ตาม ADR-0006 เหมือนแก้ contract
#
# ⚠️ ก่อน 2026-09-20 ข้อนี้ยังเป็นคำสัญญาไม่ได้ · id hash ทุกอย่างที่เห็นรวม
#    `ecosystem_as_of` และถ้อยคำ `why` ที่โมเดลเขียน — แก้ ecosystem.yaml
#    เรื่องที่ไม่เกี่ยวเลย หรือโมเดลเรียบเรียงประโยคใหม่ **id เปลี่ยนทั้งชุด**
#    และ `why` ของ advisor มาจาก LLM ซึ่งไม่ deterministic ข้ามรุ่นอยู่แล้ว
#
# conformance/payload_check.py guarantee ข้อ 10 คำนวณ id ซ้ำจากใบที่ปล่อยจริง
# ทุกรอบ — คำสัญญาที่ตรวจไม่ได้คือคำอธิบายพฤติกรรม
event_id_derivation:
  promise: ตัวตนเดิม → event_id เดิมเสมอ ข้ามรุ่นและข้ามการเขียน emitter ใหม่
  frozen: true
  since: 2026-09-20
  algorithm: sha256 ของ identity ที่ serialize แบบ sort_keys แล้วตัด 12 ตัวแรก
  identity:
    ADVISORY_ISSUED: [$.metadata.team, $.metadata.question, $.metadata.title,
                      $.metadata.priority, $.metadata.references]
    ECOSYSTEM_DRIFT_DETECTED: [$.metadata.rule, $.metadata.subject]
  excluded:
    - path: [$.metadata.why, $.metadata.detail]
      reason: >-
        ถ้อยคำที่โมเดลหรือกฎเขียน — เรียบเรียงใหม่ไม่ใช่ record ใหม่
        **ผลที่ตามมาที่ผู้รับควรรู้**: ถ้าเราออกข้อเสนอเดิมด้วยถ้อยคำใหม่
        id จะเท่าเดิม store ที่ปฏิเสธของซ้ำจะเก็บถ้อยคำ*เดิม*ไว้ ไม่ใช่ถ้อยคำใหม่
    - path: [$.occurred_at, $.metadata.ecosystem_as_of, $.metadata.generated_by,
             $.metadata.grounded]
      reason: บอกว่า "ดูเมื่อไร ใครดู" ไม่ได้บอกว่า "เรื่องอะไร"
    - path: [$.sequence]
      reason: ตำแหน่งในรอบ ไม่ใช่ตัวตน — แทรกข้อใหม่ต้องไม่ย้าย id ของข้ออื่น
  known_limit: >-
    เงื่อนไข drift ที่ถูกแก้แล้วกลับมาเกิดใหม่ จะได้ `event_id` เดิม เพราะเนื้อหา
    เหมือนกันทุกตัวอักษร · store ที่ idempotent ด้วย event_id จะมองว่าเป็นใบเดิม
    ไม่ใช่การเกิดซ้ำ — ถ้าผู้รับต้องการให้การเกิดซ้ำมองเห็นได้ ต้องมีตัวแยกเพิ่ม
    ซึ่งเปลี่ยน semantics ของ store จึงเป็นการตัดสินใจของผู้รับ ไม่ใช่ของเรา

# ── ขอบเขตของตัวไล่ leaf — ตอบ ADR-0034 ข้อ 7
#
# "เมื่อ semantics_version ขยับ และขอบเขตของ invariant เปลี่ยน ผู้ผลิตต้องตอบว่า
#  ตัวตรวจของตัวเองครอบขอบเขตใหม่แล้วหรือยัง"
#
# ตอบ: ครอบแล้ว และไม่มีอะไรต้องแก้ · RFC-0017 ขยายกฎ leaf ให้ผูกทุกสัญญาที่
# semantics เป็นของ devfactory-core ไม่ใช่เฉพาะ event — แต่ repo นี้ผลิต payload
# รูปเดียวคือ event/v1 (ไม่ได้ pin approval/v1) ขอบเขตใหม่จึงเท่ากับขอบเขตเดิม
#
# ⚠️ แต่มีของที่เจอตอนไปตอบ: guarantee 9 **ไม่เคยเห็น ECOSYSTEM_DRIFT_DETECTED
# สักใบ** เพราะ emitter ปล่อยเฉพาะ finding ระดับ error และ guardian ไม่มี error
# ในสถานะปกติ — `$.metadata.detail` กับ `$.metadata.fix` ประกาศไว้ตั้งแต่ 17 ก.ย.
# แต่ไม่มีอะไรยืนยันว่าตรงกับของจริง · แก้แล้วโดยยกป้าย severity ของ finding จริง
# ไม่ใช่เขียน fixture — collect() ใน payload_check.py
leaf_scanner_scope:
  covers: ทุก payload ที่ repo นี้ปล่อย (event/v1 อย่างเดียว)
  verified_against: [ADVISORY_ISSUED, ECOSYSTEM_DRIFT_DETECTED]
  answered_for: ADR-0034 ข้อ 7 · semantics 1.5

# ── ทะเบียนตัวชี้ — leaf ทุกเส้นทางต้องมีคนตัดสินแล้ว (ปิด · fail closed)
#
# ที่มา: `botforge` ในโต๊ะกลาง 20 ก.ย. ชี้ว่าการประกาศที่กว้างเกินจะ **กลืน ratchet
# ของตัวเอง** — ร่างแรกเขาใส่ `$.metadata.*` แล้วเห็นว่า key ใหม่ที่เป็นข้อความของคน
# จะผ่านเพราะ "ประกาศไว้แล้ว" · `agent-platform` เรียกรูปนี้ว่า "เดินถึง แต่ประกาศ
# ไว้ให้ผ่าน → เขียว" ซึ่งแย่กว่าตัวตรวจที่เดินไม่ถึง เพราะมันไม่ได้ว่าง มันเขียว
#
# ⚠️ ของเราเป็นรูปที่สี่ที่ยังไม่มีใครตั้งชื่อ — **ตัวตรวจเดินถึง leaf แล้วเดาจาก "ค่า"
# ว่าเป็นข้อความของคนหรือไม่** (มีช่องว่าง · ยาวเกิน 64 · มีอักษรไทย) · วัดแล้ว
# ชื่อคนที่ไม่มีช่องว่างหลุดเงียบทุกตัว:
#
#     'Somchai' · 'Ann' · 'somchai@example.com' · '0812345678'   → ปล่อยผ่านหมด
#
# ซึ่งคือ `actor.display_name` ที่ `care-agent-platform` โดนมาแล้วจริง และ `botforge`
# ตัดทิ้งก่อนเขียนใบแรก · ถ้าวันหนึ่งมี leaf แบบนั้นโผล่ในใบเรา ไม่มีอะไรจับได้เลย
#
# แก้โดยตัดสินจาก **เส้นทาง** ไม่ใช่จาก **ค่า** — เส้นทางเป็นสิ่งที่มีคนตัดสิน
# ส่วนค่าเป็นสิ่งที่ตัวตรวจเดา · leaf เส้นทางใหม่ที่ยังไม่มีใครตัดสินใจเรื่องมัน = แดง
#
# ห้าม wildcard ทั้งในนี้และใน text_fields — guarantee ข้อ 9 บังคับ
pointer_leaves:
  - path: $.event_id
    why: id ที่สร้างจาก identity ที่ประกาศไว้ — ดู event_id_derivation
  - path: $.correlation_id
    why: id ของรอบ สร้างจาก identity เหมือนกัน
  - path: $.subject_id
    why: id ของสิ่งที่ event พูดถึง — advisory ใช้ id ของรอบ · drift ใช้ (rule, subject)
  - path: $.subject_type
    why: enum ของ event/v1
  - path: $.event_type
    why: ชื่อชนิดตาม EventTypeName — ชุดเปิดแต่เป็นชื่อ ไม่ใช่ข้อความ
  - path: $.tenant_id
    why: id ตาม identity/v1
  - path: $.occurred_at
    why: timestamp
  - path: $.sequence
    why: จำนวนเต็ม ตำแหน่งใน subject
  - path: $.source.kind
    why: enum — external | internal
  - path: $.source.system
    why: ชื่อ repo ของเราเอง ค่าคงที่ในโค้ด
  - path: $.metadata.record_type
    why: ชื่อชนิดที่เราประกาศไว้ใน vocabulary_added
  - path: $.metadata.team
    why: id ของทีมจาก graph — grounding check ปฏิเสธ id ที่ไม่มีจริง
  - path: $.metadata.priority
    why: จำนวนเต็ม
  - path: $.metadata.references[]
    why: id ของ component/contract จาก graph — ผ่าน grounding check แบบ strict
  - path: $.metadata.grounded
    why: boolean
  - path: $.metadata.ecosystem_as_of
    why: วันที่
  - path: $.metadata.generated_by.provider
    why: ชื่อ provider จากชุดปิด — claude | chatgpt | offline
  - path: $.metadata.generated_by.model
    why: ชื่อรุ่นของโมเดล ไม่ใช่ข้อความที่ใครพิมพ์
  - path: $.metadata.rule
    why: id ของกฎใน guardian/rules.yaml
  - path: $.metadata.subject
    why: id ของสิ่งที่ผิดกฎ — component · contract · plane · team

# ── leaf ที่ถือข้อความของมนุษย์ (event/v1 semantics 1.3 · devfactory-core RFC-0013)
#
# กฎสามข้อของ invariant ใหม่
#   1. อ่านที่ leaf ไม่ใช่ที่ field ระดับบน — object กับ array เป็นภาชนะ ไม่ใช่ค่า
#   2. leaf ที่อาจถือข้อความของมนุษย์ ต้องประกาศไว้ · ที่เหลือต้องเป็น pointer
#   3. leaf ที่ประกาศ ต้องบอกว่ากติกาการเก็บ/ลบอยู่ชั้นไหน
#
# conformance/payload_check.py guarantee ข้อ 9 บังคับข้อ 1 กับ 2 ทุกรอบ —
# leaf ที่เป็นข้อความแต่ไม่ได้ประกาศ = conformance ไม่ผ่าน
text_fields:
  - path: $.metadata.question
    event_types: [ADVISORY_ISSUED]
    written_by: human
    detail: >-
      คำถามที่คนพิมพ์เข้ามาทาง /ask — **รับอะไรก็ได้** ทุกวันนี้ระบบส่งค่าคงที่
      "ทีมเราควรทำอะไรต่อ?" เพราะ emit ยิงเองตามรอบ แต่ endpoint เปิดให้พิมพ์อิสระ
      ถ้าวันหนึ่งมีคนถามด้วยข้อความที่มีข้อมูลส่วนบุคคล มันจะไหลมาที่นี่
      · เป็น leaf เดียวของเราที่ควบคุมเนื้อหาไม่ได้
    retention_layer: >-
      ลบราย field ไม่ได้ · เราไม่ได้เป็นเจ้าของ store — กติกาการเก็บอยู่ที่ store
      ของผู้รับ · ฝั่งเราไฟล์ที่เผยแพร่คือ integration/events/sample.jsonl ใน git
      สาธารณะ (ลบได้ทางเดียวคือเขียนประวัติใหม่ ซึ่งเราถือว่าไม่มีให้ใช้)
      และ CI artifact ที่หมดอายุเอง 14 วัน

  - path: $.metadata.title
    event_types: [ADVISORY_ISSUED]
    written_by: system
    detail: >-
      หัวข้อข้อเสนอที่ advisor สร้างจากกฎหรือจาก LLM · ประกอบจาก id ของ component
      และ contract ที่มาจาก graph ไม่ได้มาจากข้อความที่ใครพิมพ์
    retention_layer: เหมือน $.metadata.question

  - path: $.metadata.why
    event_types: [ADVISORY_ISSUED]
    written_by: system
    detail: >-
      เหตุผลของข้อเสนอ · อ้าง id ที่ผ่าน grounding check แล้วเท่านั้น — id ที่ไม่มีใน
      ecosystem จะถูกรายงานว่าแต่งขึ้น ไม่ถูกปล่อยเงียบ ๆ
      · **ห้ามมี chain-of-thought** ตาม invariant เดิมของ event/v1 และ guarantee
      ข้อ 6 ของเราตรวจทุกรอบ
    retention_layer: เหมือน $.metadata.question

  - path: $.metadata.detail
    event_types: [ECOSYSTEM_DRIFT_DETECTED]
    written_by: system
    detail: ข้อเท็จจริงของ finding ที่ guardian ประกอบจาก id และตัวเลข ไม่มีข้อความที่คนพิมพ์
    retention_layer: เหมือน $.metadata.question

  - path: $.metadata.fix
    event_types: [ECOSYSTEM_DRIFT_DETECTED]
    written_by: human
    detail: >-
      ทางแก้ที่คนเขียนไว้ล่วงหน้าใน guardian/rules.yaml — เป็นข้อความคงที่ต่อกฎ
      ไม่ใช่ข้อความที่พิมพ์ต่อเหตุการณ์ · review ผ่าน PR เหมือนโค้ด
    retention_layer: เหมือน $.metadata.question

# ไม่มี leaf ไหนของเราถือข้อมูลส่วนบุคคลของ subject — subject ของเราคือ repo,
# contract, team ไม่ใช่คน · ข้อยกเว้นเดียวที่เป็นไปได้คือ $.metadata.question ข้างบน

# ช่องว่างที่ยังเหลือ — บันทึกไว้ให้เห็นโดยไม่ต้องมาถาม
# (รูปแบบเดียวกับที่ devfactory-core และ care-agent-platform ทำ)
blocking:
  - id: not-in-consumer-registry
    detail: >-
      agent-platform/architecture/consumers.md ยังไม่มีแถวของ repo นี้
      — เป็นการแก้ที่ repo ของเขา เราทำฝ่ายเดียวไม่ได้
    severity: low
    status: resolved   # ลงทะเบียนแล้ว · #40 ปิด · เป็น 1 ใน 5 รายที่ conform จริง
    issue: https://github.com/monthop-gmail/agent-platform/issues/40

  - id: no-consumer-of-our-events
    detail: >-
      event ที่ปล่อยออกมายังไม่มีใครรับไปทำต่อ — devfactory-core รับ event/v1
      ได้ตามสัญญาอยู่แล้ว แต่การต่อท่อจริงต้องตกลงเรื่อง transport กันก่อน
    severity: medium
    status: raised
    issue: https://github.com/monthop-gmail/devfactory-core/issues/32
    # trigger ตามเงื่อนไข ไม่ใช่วันที่ลอย ๆ — สิ่งที่ขวางคือ store ของปลายทาง
    # ที่ยังเป็น in-memory ไม่ใช่เวลา
    decide_when: devfactory-core EventLog มีที่เก็บถาวร
    backstop: 2026-10-31   # ถึงวันนี้ยังไม่มี store → artifact handoff คือท่อจริง ปิด issue
    interim: artifact handoff — integration/events/sample.jsonl + CI artifact

registration: conforming   # registered | conforming
