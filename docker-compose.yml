# PostgreSQL สำหรับ Ecosystem Graph
# พอร์ต 55434 — เลี่ยงชนกับ enterprise-knowledge ที่ใช้ 55433
services:
  db:
    image: postgres:16-alpine
    container_name: ecosystem-graph-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecosystem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecosystem}
      POSTGRES_DB: ${POSTGRES_DB:-ecosystem}
    ports:
      - "${POSTGRES_PORT:-55434}:5432"
    volumes:
      - ecosystem-graph-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecosystem} -d ${POSTGRES_DB:-ecosystem}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # profile app — ไม่ขึ้นมาด้วย make up ปกติ (นั่นยก DB อย่างเดียว)
  #   docker compose --profile app up -d --build
  api:
    profiles: ["app"]
    build: .
    container_name: ecosystem-graph-api
    environment:
      ECOSYSTEM_DSN: postgresql://${POSTGRES_USER:-ecosystem}:${POSTGRES_PASSWORD:-ecosystem}@db:5432/${POSTGRES_DB:-ecosystem}
      ECOSYSTEM_LLM_PROVIDER: ${ECOSYSTEM_LLM_PROVIDER:-offline}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-1}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ecosystem-graph-data:
