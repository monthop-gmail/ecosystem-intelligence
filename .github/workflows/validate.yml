name: validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 2 * * 1"   # รายสัปดาห์ — จับ repo ที่เกิดใหม่/หายไป และ conformance ที่เกิน 90 วัน

jobs:
  ecosystem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema
      - name: validate ecosystem.yaml
        run: make validate
      - name: ตรวจกับ GitHub จริง
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: make validate-github
